apiVersion: swytch.getswytch.com/v1alpha1
kind: Swytch
metadata:
  name: unix-cache
spec:
  deployment: sidecar
  memory: 512Mi
  sidecar:
    transport: unix
  discovery:
    dns:
      secretKeyRef:
        name: swytch-secret
        key: cluster-passphrase
---
apiVersion: batch/v1
kind: Job
metadata:
  name: unix-client
spec:
  template:
    metadata:
      annotations:
        swytch.getswytch.com/profile: unix-cache
    spec:
      restartPolicy: Never
      containers:
        - name: app
          image: redis:7.4-alpine
          command: [sh, -ec, 'until redis-cli -s /var/run/swytch/swytch.sock PING; do sleep 1; done']
